name: Update Recent Repos

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Her gün gece yarısı çalışır
  workflow_dispatch:       # Manuel tetikleme

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch recently pushed repos and update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Son push tarihine göre sıralı public repo'ları çek
            const { data: allRepos } = await github.rest.repos.listForUser({
              username: 'byerlikaya',
              type: 'public',
              sort: 'pushed',
              direction: 'desc',
              per_page: 10
            });

            // Profil reposunu hariç tut
            const repos = allRepos
              .filter(r => r.name.toLowerCase() !== 'byerlikaya')
              .slice(0, 3);

            const langColors = {
              'C#': '178600',
              'Python': '3572A5',
              'JavaScript': 'f1e05a',
              'TypeScript': '2b7489',
            };

            const rows = repos.map(repo => {
              const lang = repo.language || '—';
              const color = langColors[lang] || 'aaaaaa';
              const langBadge = repo.language
                ? `![${lang}](https://img.shields.io/badge/-${encodeURIComponent(lang)}-${color}?style=flat-square&logoColor=white)`
                : '—';
              const desc = repo.description || '*No description*';
              const pushed = new Date(repo.pushed_at).toISOString().split('T')[0];
              return `| [**${repo.name}**](${repo.html_url}) | ${desc} | ${langBadge} | ⭐ ${repo.stargazers_count} | ${pushed} |`;
            });

            const table = [
              '| Project | Description | Lang | Stars | Last Push |',
              '|---------|-------------|------|-------|-----------|',
              ...rows
            ].join('\n');

            const newSection = `<!-- RECENT-REPOS:START -->\n${table}\n<!-- RECENT-REPOS:END -->`;

            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- RECENT-REPOS:START -->[\s\S]*?<!-- RECENT-REPOS:END -->/,
              newSection
            );
            fs.writeFileSync('README.md', readme);
            console.log('README updated with recent repos.');

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet || (git add README.md && git commit -m "chore: update recent repos [skip ci]" && git push)
