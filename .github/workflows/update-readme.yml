name: Update Pinned Repos

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Her gün gece yarısı çalışır
  workflow_dispatch:       # Manuel tetikleme de mümkün

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned repos and update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // GitHub GraphQL API ile pinned repo'ları çek
            const query = `
              query {
                user(login: "byerlikaya") {
                  pinnedItems(first: 6, types: REPOSITORY) {
                    nodes {
                      ... on Repository {
                        name
                        description
                        url
                        stargazerCount
                        primaryLanguage {
                          name
                        }
                        forkCount
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const repos = result.user.pinnedItems.nodes;

            // Dil renk eşleştirmesi
            const langColors = {
              'C#': '178600',
              'Python': '3572A5',
              'JavaScript': 'f1e05a',
              'TypeScript': '2b7489',
              'default': 'aaaaaa'
            };

            // Tablo satırlarını oluştur
            const rows = repos.map(repo => {
              const lang = repo.primaryLanguage?.name || '—';
              const color = langColors[lang] || langColors['default'];
              const langBadge = repo.primaryLanguage
                ? `![${lang}](https://img.shields.io/badge/-${encodeURIComponent(lang)}-${color}?style=flat-square&logoColor=white)`
                : '—';
              const desc = repo.description || '*No description*';
              const stars = repo.stargazerCount;
              return `| [**${repo.name}**](${repo.url}) | ${desc} | ${langBadge} | ⭐ ${stars} |`;
            });

            const table = [
              '| Project | Description | Lang | Stars |',
              '|---------|-------------|------|-------|',
              ...rows
            ].join('\n');

            const newSection = `<!-- PINNED-REPOS:START -->\n<!-- This section is auto-generated by GitHub Actions — do not edit manually -->\n${table}\n<!-- PINNED-REPOS:END -->`;

            // README'yi güncelle
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- PINNED-REPOS:START -->[\s\S]*?<!-- PINNED-REPOS:END -->/,
              newSection
            );
            fs.writeFileSync('README.md', readme);
            console.log('README updated successfully.');

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet || (git add README.md && git commit -m "chore: update pinned repos [skip ci]" && git push)
